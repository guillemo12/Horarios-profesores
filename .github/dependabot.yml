# Configuración de GitHub Dependabot
# Documentación: https://docs.github.com/es/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. Dependencias de Gradle (Kotlin/Java - Backend Ktor)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore(deps-gradle)"
    labels:
      - "dependencies"
      - "gradle"

  # 2. Dependencias de Rust / Cargo (App de escritorio con Tauri 2.0)
  - package-ecosystem: "cargo"
    directory: "/Proyecto_Horarios/src-tauri"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 15
    commit-message:
      prefix: "chore(deps-rust)"
    labels:
      - "dependencies"
      - "rust"
      - "tauri"

  # 3. Dependencias de Node / npm (MCP Server)
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps-npm)"
    labels:
      - "dependencies"
      - "npm"

  # 4. Flujos de trabajo de GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
