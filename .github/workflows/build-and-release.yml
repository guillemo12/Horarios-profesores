name: Build and Release EduSchedule

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Sync App Version from Tag / Release
        shell: bash
        run: |
          RAW_TAG="${{ github.event.release.tag_name || github.ref_name }}"
          APP_VER=$(echo "$RAW_TAG" | sed -E 's/^[vV]//')
          
          if [[ "$APP_VER" =~ ^[0-9]+\.[0-9]+ ]]; then
            echo "====> Sincronizando versión de la app con el Tag: $APP_VER"
            deno eval "
              const ver = '$APP_VER';

              // 1. tauri.conf.json
              const tauriPath = 'Proyecto_Horarios/src-tauri/tauri.conf.json';
              try {
                const conf = JSON.parse(Deno.readTextFileSync(tauriPath));
                conf.version = ver;
                Deno.writeTextFileSync(tauriPath, JSON.stringify(conf, null, 2));
                console.log('Actualizado tauri.conf.json -> ' + ver);
              } catch (_) {}

              // 2. Cargo.toml
              const cargoPath = 'Proyecto_Horarios/src-tauri/Cargo.toml';
              try {
                let cargo = Deno.readTextFileSync(cargoPath);
                cargo = cargo.replace(/^version\s*=\s*\"[^\"]+\"/m, 'version = \"' + ver + '\"');
                Deno.writeTextFileSync(cargoPath, cargo);
                console.log('Actualizado Cargo.toml -> ' + ver);
              } catch (_) {}

              // 3. updater.ts
              const updaterPath = 'Web/src/updater.ts';
              try {
                let updater = Deno.readTextFileSync(updaterPath);
                updater = updater.replace(/export const CURRENT_VERSION = \"[^\"]+\";/, 'export const CURRENT_VERSION = \"' + ver + '\";');
                Deno.writeTextFileSync(updaterPath, updater);
                console.log('Actualizado updater.ts -> ' + ver);
              } catch (_) {}

              // 4. eduschedule.html
              const htmlPath = 'Web/src/eduschedule.html';
              try {
                let html = Deno.readTextFileSync(htmlPath);
                html = html.replace(/Versión instalada: <span class=\"[^\"]*\">v[^<]*<\/span>/, 'Versión instalada: <span class=\"font-mono font-semibold text-indigo-600\">v' + ver + '</span>');
                Deno.writeTextFileSync(htmlPath, html);
                console.log('Actualizado eduschedule.html -> v' + ver);
              } catch (_) {}
            "
          else
            echo "====> No es un tag de versión semántica ($RAW_TAG), manteniendo versión actual."
          fi

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "Proyecto_Horarios/src-tauri -> target"
          cache-all-crates: "true"

      - name: Install Linux dependencies (Linux only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev binutils fakeroot squashfs-tools desktop-file-utils libxdo-dev build-essential libfuse2 file

      - name: Make gradlew executable (Linux only)
        if: matrix.platform == 'linux'
        run: chmod +x ./gradlew

      - name: Bundle Frontend TypeScript with Deno
        run: |
          deno run -A npm:esbuild Web/src/Datos.ts --bundle --outfile=src/main/resources/static/Datos.js --format=iife
          cp Web/src/eduschedule.html src/main/resources/static/index.html || copy Web\src\eduschedule.html src\main\resources\static\index.html
        shell: bash

      - name: Build Fat JAR with Gradle
        run: ./gradlew shadowJar --no-daemon --build-cache --parallel

      - name: Create Embedded JVM Runtime with jpackage (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "Proyecto_Horarios\src-tauri\backend_ktor") {
            Remove-Item "Proyecto_Horarios\src-tauri\backend_ktor" -Recurse -Force
          }
          if (Test-Path "build\jpackage_input") {
            Remove-Item "build\jpackage_input" -Recurse -Force
          }
          New-Item -ItemType Directory -Path "build\jpackage_input" -Force
          Copy-Item "build\libs\horarios-profesores-all.jar" -Destination "build\jpackage_input\"
          jpackage --name backend_ktor --input build\jpackage_input --main-jar "horarios-profesores-all.jar" --main-class com.colegio.MainKt --type app-image --java-options "-Xms256m" --java-options "-Xmx4g" --dest Proyecto_Horarios/src-tauri

      - name: Create Embedded JVM Runtime with jpackage (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          rm -rf Proyecto_Horarios/src-tauri/backend_ktor build/jpackage_input
          mkdir -p build/jpackage_input
          cp build/libs/horarios-profesores-all.jar build/jpackage_input/
          jpackage --name backend_ktor --input build/jpackage_input --main-jar "horarios-profesores-all.jar" --main-class com.colegio.MainKt --type app-image --java-options "-Xms256m" --java-options "-Xmx4g" --dest Proyecto_Horarios/src-tauri
          chmod -R 755 Proyecto_Horarios/src-tauri/backend_ktor

      - name: Build Tauri Desktop App (Linux)
        if: matrix.platform == 'linux'
        working-directory: Proyecto_Horarios
        env:
          ARCH: x86_64
          NO_STRIP: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/Proyecto_Horarios/src-tauri/backend_ktor/lib/runtime/lib/server:${{ github.workspace }}/Proyecto_Horarios/src-tauri/backend_ktor/lib/runtime/lib
        run: deno run -A npm:@tauri-apps/cli build --ci --bundles deb,appimage --verbose

      - name: Build Tauri Desktop App (Windows)
        if: matrix.platform == 'windows'
        working-directory: Proyecto_Horarios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: deno run -A npm:@tauri-apps/cli build --ci --bundles msi,nsis --ignore-version-mismatches

      - name: Build Portable Single EXE (Windows only)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\EduSchedule" -Force
          $builtExe = Get-ChildItem -Path "Proyecto_Horarios\src-tauri\target\release" -Filter "*.exe" | Where-Object { $_.Name -ne "backend_ktor.exe" } | Select-Object -First 1
          Copy-Item $builtExe.FullName -Destination "dist\EduSchedule\EduSchedule.exe"
          Copy-Item "Proyecto_Horarios\src-tauri\target\release\backend_ktor" -Destination "dist\EduSchedule\backend_ktor" -Recurse
          if (Test-Path "Proyecto_Horarios\src-tauri\target\release\resources") {
            Copy-Item "Proyecto_Horarios\src-tauri\target\release\resources" -Destination "dist\EduSchedule\resources" -Recurse
          }
          powershell -ExecutionPolicy Bypass -File .\build_single_exe.ps1

      - name: Stage Windows Release Files
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist\windows_release" -Force
          if (Test-Path "EduSchedule_Unico.exe") {
            Copy-Item "EduSchedule_Unico.exe" -Destination "dist\windows_release\"
          }
          Get-ChildItem -Path "Proyecto_Horarios\src-tauri\target\release\bundle\nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\windows_release\"
          }
          Get-ChildItem -Path "Proyecto_Horarios\src-tauri\target\release\bundle\msi" -Filter "*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist\windows_release\"
          }

      - name: Stage Linux Release Files
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p dist/linux_release
          cp Proyecto_Horarios/src-tauri/target/release/bundle/appimage/*.AppImage dist/linux_release/ 2>/dev/null || true
          cp Proyecto_Horarios/src-tauri/target/release/bundle/deb/*.deb dist/linux_release/ 2>/dev/null || true

      - name: Upload Windows Artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: EduSchedule-Windows
          path: dist/windows_release/*

      - name: Upload Linux Artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: EduSchedule-Linux
          if-no-files-found: warn
          path: dist/linux_release/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EduSchedule-Windows/**/*
            EduSchedule-Linux/**/*
          generate_release_notes: true
